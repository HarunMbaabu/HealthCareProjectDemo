[project]
name = "healthcare-data-ml-system"
version = "0.1.0"
description = "Production-ready healthcare data pipeline and ML prediction API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2.2",
  "numpy>=1.26.4",
  "sqlalchemy>=2.0.35",
  "psycopg2-binary>=2.9.9",
  "python-dotenv>=1.0.1",
  "scikit-learn>=1.5.2",
  "xgboost>=2.1.1",
  "joblib>=1.4.2",
  "fastapi>=0.115.2",
  "uvicorn>=0.30.6",
  "pydantic>=2.9.2",
  "pydantic-settings>=2.5.2",
  "apscheduler>=3.10.4"
]

[tool.uv]
dev-dependencies = [
  "pytest>=8.3.3",
  "ruff>=0.6.8"
]

[tool.ruff]
line-length = 100

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
